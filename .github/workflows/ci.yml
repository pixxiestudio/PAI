name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        working-directory: ['frontend/web']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ matrix.working-directory }}/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ matrix.working-directory }}
        run: npm ci

      - name: Run linter
        working-directory: ${{ matrix.working-directory }}
        run: npm run lint --if-present || true

      - name: Run tests
        working-directory: ${{ matrix.working-directory }}
        run: npm test -- --coverage --watchAll=false
        env:
          NODE_ENV: test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: '${{ matrix.working-directory }}/coverage/lcov.info'
          flags: frontend
          fail_ci_if_error: false

      - name: Build frontend
        working-directory: ${{ matrix.working-directory }}
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000/api/v1' }}
          NODE_ENV: production

  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov black flake8

      - name: Run linter (black)
        working-directory: backend
        run: black --check . || true

      - name: Run flake8
        working-directory: backend
        run: flake8 . --max-line-length=100 || true

      - name: Run tests
        working-directory: backend
        run: pytest --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: './backend/coverage.xml'
          flags: backend
          fail_ci_if_error: false

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run security audit
        working-directory: frontend/web
        run: npm audit --audit-level=moderate || true

      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug

  build-status:
    name: Build Status Check
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests, code-quality]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.frontend-tests.result }}" != "success" ] && [ "${{ needs.frontend-tests.result }}" != "skipped" ]; then
            echo "❌ Frontend tests failed"
            exit 1
          fi
          if [ "${{ needs.backend-tests.result }}" != "success" ] && [ "${{ needs.backend-tests.result }}" != "skipped" ]; then
            echo "❌ Backend tests failed"
            exit 1
          fi
          echo "✅ All checks passed"

  notify:
    name: Notify on completion
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests, build-status]
    if: always()

    steps:
      - name: Check if all jobs succeeded
        run: |
          if [ "${{ needs.build-status.result }}" == "success" ]; then
            echo "✅ CI/CD pipeline completed successfully"
          else
            echo "❌ CI/CD pipeline failed"
            exit 1
          fi
